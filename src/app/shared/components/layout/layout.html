<div class="layout-grid">

  <!-- Sync Status Banner -->
  @if (syncCheck.syncing() || syncCheck.syncMessage()) {
  <div class="fixed top-0 left-0 right-0 z-[9999]">
    @if (syncCheck.syncing()) {
    <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    }
    @if (syncCheck.syncMessage()) {
    <div class="bg-blue-600 text-white text-xs text-center py-1.5 px-4 font-medium">
      {{ syncCheck.syncMessage() }}
    </div>
    }
  </div>
  }

  <!-- Topbar -->
  <topbar [isCollapsed]="collapsed" (toggle)="toggle()"></topbar>

  <!-- Mobile backdrop -->
  <div class="sidebar-backdrop" [class.hidden]="collapsed" (click)="toggle()"></div>

  <!-- Sidebar -->
  <aside class="sidebar-wrapper" [class.collapsed]="collapsed">
    <sidebar [collapsed]="collapsed"></sidebar>
  </aside>

  <!-- Main content -->
  <main class="content-wrapper">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
