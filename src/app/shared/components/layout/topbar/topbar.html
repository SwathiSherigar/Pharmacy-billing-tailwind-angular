<mat-toolbar class="!bg-white dark:!bg-slate-900 !px-4 !py-0 flex justify-between items-center topbar !border-b !border-slate-200 dark:!border-slate-700 !shadow-sm">

  <div class="flex items-center gap-3">
    @if (isCollapsed) {
    <img src="assets/images/logo.png" width="34" height="34" alt="logo" class="rounded-lg" />
    } @else {
    <span class="font-bold text-lg select-none text-[#1C2B70] dark:text-blue-300 tracking-tight">
      {{ auth.shopName() || 'Pharmacy' }}
    </span>
    }

    <div [ngClass]="isCollapsed ? 'pl-1' : 'pl-6'" class="transition-all duration-200">
      <button mat-icon-button aria-label="Toggle sidebar" (click)="toggle.emit()"
        class="!w-8 !h-8 !text-slate-500 dark:!text-slate-400 hover:!text-[#1C2B70] dark:hover:!text-blue-300 hover:!bg-slate-100 dark:hover:!bg-slate-800 !rounded-lg">
        <mat-icon class="material-symbols-outlined !text-[25px] my-auto">menu</mat-icon>
      </button>
    </div>
  </div>

  <button mat-icon-button aria-label="Toggle theme" (click)="theme.toggleTheme()"
    class="!w-8 !h-8 !text-slate-500 dark:!text-amber-400 hover:!bg-slate-100 dark:hover:!bg-slate-800 !rounded-lg">
    <mat-icon class="material-symbols-outlined !text-[20px]">
      {{ theme.darkMode() ? 'light_mode' : 'dark_mode' }}
    </mat-icon>
  </button>

</mat-toolbar>
