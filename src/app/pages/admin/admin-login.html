<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-indigo-950 px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4">
        <mat-icon class="material-symbols-outlined !text-white !text-3xl">admin_panel_settings</mat-icon>
      </div>
      <h1 class="text-2xl font-bold text-white">Admin Panel</h1>
      <p class="text-slate-400 mt-1">Sign in to manage clients</p>
    </div>

    <div class="bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700">

      @if (error()) {
      <div class="mb-4 p-3 rounded-lg bg-red-900/30 text-red-400 text-sm">
        {{ error() }}
      </div>
      }

      <form (ngSubmit)="submit()" class="space-y-5">
        <mat-form-field appearance="outline" class="w-full admin-field">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" placeholder="admin@example.com" required>
          <mat-icon matPrefix class="material-symbols-outlined !mr-2">mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full admin-field">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" name="password" required>
          <mat-icon matPrefix class="material-symbols-outlined !mr-2">lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon class="material-symbols-outlined">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="loading()"
          class="!w-full !h-12 !bg-indigo-600 !text-white !rounded-xl !text-base !font-semibold">
          @if (loading()) {
            <mat-spinner diameter="22" class="inline-block"></mat-spinner>
          } @else {
            Sign In as Admin
          }
        </button>
      </form>
    </div>

  </div>
</div>
