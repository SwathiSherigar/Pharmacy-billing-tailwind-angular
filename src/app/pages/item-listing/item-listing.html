<div class="p-4 !pt-0 flex flex-col gap-4 h-full" style="height: calc(100vh - 54px);">

  <div class="flex justify-end items-center pt-2 gap-2">
   <button 
  mat-raised-button 
  color="primary" 
  (click)="fileInput.click()">
  + Import
</button>

<input
  #fileInput
  type="file"
  accept=".csv"
  hidden
  (change)="importCsv($event)"
/>
  </div>

  <div class="flex flex-col bg-white rounded shadow-md flex-1 overflow-hidden">
    <div class="overflow-auto flex-1">
      <table mat-table [dataSource]="dataSource" class="w-full mat-elevation-z2 rounded">
        <ng-container matColumnDef="batch">
          <th mat-header-cell *matHeaderCellDef> Batch </th>
          <td mat-cell *matCellDef="let b"  class="text-primary font-medium"> {{ b.batch }} </td>
        </ng-container>
        <ng-container matColumnDef="expiry">
          <th mat-header-cell *matHeaderCellDef> Expiry </th>
          <td mat-cell *matCellDef="let b"> {{ b.expiry }} </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> name </th>
          <td mat-cell *matCellDef="let b"> {{ b.name }} </td>
        </ng-container>
        <ng-container matColumnDef="qty">
          <th mat-header-cell *matHeaderCellDef> qty </th>
          <td mat-cell *matCellDef="let b"> {{ (b.qty) }} </td>
        </ng-container>
          <ng-container matColumnDef="rate">
          <th mat-header-cell *matHeaderCellDef> rate </th>
          <td mat-cell *matCellDef="let b"> {{ (b.rate) }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="!bg-gray-100 border-b !border-gray-300"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 50, 100]" ></mat-paginator>

  </div>


</div>
