<h2 mat-dialog-title class="my-0 p-2 px-3">PDF Font Settings</h2>

<form [formGroup]="form">

  <div mat-dialog-content class="flex flex-col gap-2">

    <mat-form-field appearance="outline" class="w-full mat-sm-input">
      <mat-label>Heading Size</mat-label>
      <input matInput type="number" formControlName="headingSize" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mat-sm-input">
      <mat-label>Sub Heading Size</mat-label>
      <input matInput type="number" formControlName="subHeadingSize" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mat-sm-input">
      <mat-label>Table Font Size</mat-label>
      <input matInput type="number" formControlName="tableSize" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mat-sm-input">
      <mat-label>Normal Text Size</mat-label>
      <input matInput type="number" formControlName="normalTextSize" />
    </mat-form-field>

  </div>

  <mat-dialog-actions align="end">
    <button matButton="outlined" color="primary" (click)="save()">
      Save
    </button>
  </mat-dialog-actions>

</form>
